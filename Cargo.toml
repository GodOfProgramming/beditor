[package]
name = "beditor"
version = "0.17.3"
edition = "2024"
rust-version = "1.92.0"
publish = false

[workspace]
members = [
  ".",
  "crates/common",
  "crates/macros",
  "crates/notify",
  "crates/persistent-id",
  "crates/singleton",
  "crates/type_extractor",
  "crates/widgets",
]

[workspace.dependencies]
bevy = "0.18.0"
bevy_egui = { version = "0.39.1", default-features = false }
derive-new = "0.7.0"
derive_more = "1.0.0"
egui = "0.33.2"
egui_commonmark = "0.22.0"
egui_phosphor_icons = "0.2.0"
itertools = "0.14.0"
nameof = "1.3.0"
parking_lot = "0.12.5"
quote = "1.0.42"
ron = "0.12.0"
serde = "1.0"
smallvec = "1.15.1"
syn = "2.0.110"
uuid = "1.18.1"
variadics_please = "1.1.0"

[dependencies]

# exports
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }
egui = { workspace = true, features = ["serde"] }
typetag = "0.2.21"

# workspace
common = { path = "./crates/common" }
macros = { path = "./crates/macros" }
notify = { path = "./crates/notify" }
persistent-id = { path = "./crates/persistent-id" }
singleton = { path = "./crates/singleton" }
widgets = { path = "./crates/widgets" }

# internal
anyhow = "1.0.100"
async-std = "1.13.2"
async-walkdir = "2.1.0"
bevy = { workspace = true, features = [
  "asset_processor",
  "bevy_dev_tools",
  "bevy_remote",
  "reflect_documentation",
  "serialize",
] }
bevy_egui = { workspace = true, features = [
  "bevy_ui",
  "default_fonts",
  "manage_clipboard",
  "open_url",
  "render",
] }
bevy_infinite_grid = "0.18.0"
bevy_mod_outline = { git = "https://github.com/LesserKnownThings/bevy_mod_outline", rev = "531d8cff46fae8b5d5acc008dd4860dd0a42489a" }
bevy_transform_tools = { git = "https://github.com/8th-Boundary/bevy_transform_tools", branch = "main" }
bytemuck = "1.24.0"
camino = "1.2.1"
const_format = "0.2.35"
convert_case = "0.10.0"
derive-new = { workspace = true }
derive_more = { workspace = true, features = ["full"] }
dotenvy = "0.15.7"
egui-file-dialog = "0.12.0"
egui-probe = "0.10.0"
egui-snarl = "0.9.0"
egui_autocomplete = "12.0.0"
egui_commonmark = "0.22.0"
egui_dock = { version = "0.18.0", features = ["serde"] }
egui_logger = "0.9.0"
egui_phosphor_icons = { workspace = true }
egui_taffy = "0.10.0"
egui_tracing = { git = "https://github.com/GodOfProgramming/egui_tracing.git", branch = "egui/0.33.2" }
fuzzy-matcher = "0.3.7"
image = "0.25.9"
include_dir = "0.7.4"
Inflector = "*"
inventory = "0.3.21"
itertools = { workspace = true }
lazy_static = "1.5.0"
leafwing-input-manager = "0.20.0"
log = "0.4.28"
maplit = "1.0.2"
mimalloc = "*"
nameof = { workspace = true }
parking_lot = { workspace = true }
petgraph = "0.8.3"
phf = { version = "0.13.1", features = ["macros"] }
platform-dirs = "0.3.0"
postcard = { version = "1.1.3", features = ["use-std"] }
profiling = { version = "1.0.17", features = ["profile-with-tracing"] }
quote = "1.0.42"
ron = { workspace = true }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rusqlite_migration = { version = "2.3.0", features = ["from-directory"] }
serde_json = "1.0"
smallvec = { workspace = true }
smartstring = "1.0.1"
smol_str = "0.3.4"
speculoos = "0.13.0"
static_assertions = "1.1.0"
strum = "0.27"
strum_macros = "0.27"
struple = "0.2.0"
thiserror = "2.0.17"
tokio = { version = "1.50.0", default-features = false, features = ["sync"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-tracy = { version = "0.11.4", optional = true }
variadics_please = { workspace = true }
vfs = { git = "https://github.com/GodOfProgramming/vfs-rs.git", rev = "5c2128f8537b0055e0e35fb548dcbe8a660a9c20" }
walkdir = "2.5.0"
xml-rs = "1.0.0"

[features]
default = ["dev", "watch"]
dev = ["bevy/track_location", "bevy/asset_processor"]
profiling = ["bevy/trace_tracy", "dep:tracing-tracy"]
watch = ["bevy/file_watcher"]
editor-dev = []
validate = []

[dev-dependencies]
egui_demo_lib = "0.33.2"
bevy = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
