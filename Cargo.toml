[package]
name = "beditor"
version = "0.17.3"
edition = "2024"
rust-version = "1.92.0"
publish = false

[workspace]
members = [
  ".",
  "crates/macros",
  "crates/notify",
  "crates/persistent-id",
  "crates/singleton",
  "crates/type_extractor",
  "crates/widgets",
]

[workspace.dependencies]
bevy = "0.17.3"
bevy_egui = { version = "0.38.0", default-features = false }
derive_more = "1.0.0"
egui = "0.33.2"
egui_phosphor_icons = "0.2.0"
itertools = "0.14.0"
quote = "1.0.42"
serde = "1.0"
smallvec = "1.15.1"
syn = "2.0.110"
uuid = "1.18.1"

[dependencies]

# exports
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }
egui = { workspace = true, features = ["serde"] }

# workspace
notify = { path = "./crates/notify" }
persistent-id = { path = "./crates/persistent-id" }
singleton = { path = "./crates/singleton" }

# internal
anyhow = "1.0.100"
async-std = "1.13.2"
bevy = { workspace = true, features = [
  "default",
  "serialize",
  "bevy_remote",
  "reflect_documentation",
  "bevy_dev_tools",
] }
bevy-axes-gizmo = "0.2.0"
bevy_egui = { workspace = true, features = [
  "bevy_ui",
  "default_fonts",
  "manage_clipboard",
  "open_url",
  "render",
] }
bevy_infinite_grid = "0.17.0"
bevy_mod_outline = { git = "https://github.com/komadori/bevy_mod_outline", rev = "9b509abe41ac1d2b882adaf63855e24a20ced3ff" }
brefabs = "0.7.0"
bytemuck = "1.24.0"
camino = "1.2.1"
const_format = "0.2.35"
convert_case = "0.10.0"
derive-new = "0.7.0"
derive_more = { workspace = true, features = ["full"] }
disqualified = "1.0.0"
dotenvy = "0.15.7"
egui-file-dialog = "0.12.0"
egui-probe = "0.10.0"
egui-snarl = "0.9.0"
egui_autocomplete = "12.0.0"
egui_commonmark = "0.22.0"
egui_dock = { version = "0.18.0", features = ["serde"] }
egui_logger = "0.9.0"
egui_phosphor_icons = { workspace = true }
egui_taffy = "0.10.0"
egui_tracing = { git = "https://github.com/GodOfProgramming/egui_tracing.git", branch = "egui/0.33.2" }
fuzzy-matcher = "0.3.7"
image = "0.25.9"
include_dir = "0.7.4"
inventory = "0.3.21"
itertools = { workspace = true }
lazy_static = "1.5.0"
leafwing-input-manager = "0.19.0"
log = "0.4.28"
macros = { path = "./crates/macros" }
maplit = "1.0.2"
mimalloc = "*"
nameof = "1.3.0"
parking_lot = "0.12.5"
petgraph = "0.8.3"
phf = { version = "0.13.1", features = ["macros"] }
platform-dirs = "0.3.0"
postcard = { version = "1.1.3", features = ["use-std"] }
profiling = { version = "1.0.17", features = ["profile-with-tracing"] }
quote = "1.0.42"
ron = "0.12.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rusqlite_migration = { version = "2.3.0", features = ["from-directory"] }
serde_json = "1.0"
smallvec = { workspace = true }
smartstring = "1.0.1"
smol_str = "0.3.4"
speculoos = "0.13.0"
static_assertions = "1.1.0"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-tracy = { version = "0.11.4", optional = true }
transform-gizmo-bevy = { git = "https://github.com/GodOfProgramming/transform-gizmo.git", rev = "b1b2ac13e0526dff01915758dd4ba4c576d2bfd2" }
variadics_please = "1.1.0"
vfs = { git = "https://github.com/GodOfProgramming/vfs-rs.git", rev = "ed5ba004878e076bc3e9bdf8b133e62ccba1ba0c" }
walkdir = "2.5.0"
widgets = { path = "./crates/widgets" }
xml-rs = "1.0.0"

[features]
default = ["dev", "watch"]
dev = ["bevy/track_location", "bevy/asset_processor"]
profiling = ["bevy/trace_tracy", "dep:tracing-tracy"]
watch = ["bevy/file_watcher"]
editor-dev = []
validate = []

[dev-dependencies]
egui_demo_lib = "0.33.2"
bevy = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
