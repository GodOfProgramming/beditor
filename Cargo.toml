[package]
name = "beditor"
version = "0.17.2"
edition = "2024"
rust-version = "1.91.0"
publish = false

[workspace]
members = ["crates/beditor-lib", "crates/macros", "crates/persistent-id"]

[workspace.dependencies]
anyhow = "1.0.100"
async-std = "1.13.2"
bevy = "0.17.2"
bevy-inspector-egui = "0.35.0"
bevy_egui = "0.38.0"
derive-new = "0.7.0"
derive_more = "1.0.0"
dotenvy = "0.15.7"
egui = "0.33.2"
egui-file-dialog = "0.12.0"
egui_phosphor_icons = "0.2.0"
egui-snarl = "0.9.0"
egui_demo_lib = "0.33.2"
egui_dock = "0.18.0"
include_dir = "0.7.4"
inventory = "0.3.21"
itertools = "0.14.0"
lazy_static = "1.5.0"
leafwing-input-manager = "0.19.0"
macros = { path = "./crates/macros" }
parking_lot = "0.12.5"
persistent-id = { path = "./crates/persistent-id" }
petgraph = "0.8.3"
platform-dirs = "0.3.0"
postcard = "1.1.3"
proc-macro2 = "1.0.103"
profiling = "1.0.17"
quote = "1.0.42"
ron = "0.8.1"
rusqlite = "0.37.0"
rusqlite_migration = "2.3.0"
serde = "1.0"
serde_json = "1.0"
speculoos = "0.13.0"
static_assertions = "1.1.0"
syn = "2.0.110"
thiserror = "2.0.17"
toml = "0.9.8"
type_extractor = { path = "./crates/type_extractor" }
uuid = "1.18.1"
variadics_please = "1.1.0"
walkdir = "2.5.0"
xml-rs = "1.0.0"

[dependencies]
beditor-lib = { path = "crates/beditor-lib" }

[dev-dependencies]
egui_demo_lib = { workspace = true }
bevy = { workspace = true }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[features]
profiling = ["beditor-lib/profiling"]
watch = ["beditor-lib/watch"]
