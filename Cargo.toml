[package]
name = "beditor"
version = "0.17.3"
edition = "2024"
rust-version = "1.92.0"
publish = false

[workspace]
members = [".", "crates/macros", "crates/persistent-id"]

[workspace.dependencies]
anyhow = "1.0.100"
async-std = "1.13.2"
bevy = "0.17.3"
bevy-inspector-egui = { version = "0.35.0", git = "https://github.com/GodOfProgramming/bevy-inspector-egui.git", rev = "51d2e4dd97e9c3e3656480d87281522c30f34bb6" }
bevy_egui = "0.38.0"
brefabs = "0.7.0"
camino = "1.2.1"
const_format = "0.2.35"
convert_case = "0.10.0"
derive-new = "0.7.0"
derive_more = "1.0.0"
dotenvy = "0.15.7"
egui = "0.33.2"
egui-file-dialog = "0.12.0"
egui-probe = "0.10.0"
egui-snarl = "0.9.0"
egui-toast = "0.19.0"
egui_demo_lib = "0.33.2"
egui_dock = "0.18.0"
egui_logger = "0.9.0"
egui_phosphor_icons = "0.2.0"
egui_taffy = "0.10.0"
egui_tracing = { git = "https://github.com/GodOfProgramming/egui_tracing.git", branch = "egui/0.33.2" }
include_dir = "0.7.4"
inventory = "0.3.21"
itertools = "0.14.0"
lazy_static = "1.5.0"
leafwing-input-manager = "0.19.0"
log = "0.4.28"
macros = { path = "./crates/macros" }
maplit = "1.0.2"
parking_lot = "0.12.5"
persistent-id = { path = "./crates/persistent-id" }
petgraph = "0.8.3"
platform-dirs = "0.3.0"
postcard = "1.1.3"
proc-macro2 = "1.0.103"
profiling = "1.0.17"
quote = "1.0.42"
ron = "0.12.0"
rusqlite = "0.37.0"
rusqlite_migration = "2.3.0"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
smallvec = "1.15.1"
speculoos = "0.13.0"
static_assertions = "1.1.0"
strum = "0.27"
strum_macros = "0.27"
syn = "2.0.110"
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-tracy = "0.11.4"
type_extractor = { path = "./crates/type_extractor" }
uuid = "1.18.1"
variadics_please = "1.1.0"
vfs = { git = "https://github.com/GodOfProgramming/vfs-rs.git", rev = "ed5ba004878e076bc3e9bdf8b133e62ccba1ba0c" }
walkdir = "2.5.0"
xml-rs = "1.0.0"


[dependencies]

# exports
bevy_egui = { workspace = true }
macros = { workspace = true }
persistent-id = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }

# internal
async-std = { workspace = true }
bevy = { workspace = true, features = ["default", "serialize", "bevy_remote"] }
bevy-inspector-egui = { workspace = true, features = ["highlight_changes"] }
brefabs = { workspace = true }
camino = { workspace = true }
const_format = { workspace = true }
convert_case = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true, features = ["full"] }
dotenvy = { workspace = true }
egui = { workspace = true, features = ["serde"] }
egui-file-dialog = { workspace = true }
egui-toast = { workspace = true }
egui_dock = { workspace = true, features = ["serde"] }
egui_logger = { workspace = true }
egui_phosphor_icons = { workspace = true }
egui_taffy = { workspace = true }
egui_tracing = { workspace = true }
include_dir = { workspace = true }
itertools = { workspace = true }
leafwing-input-manager = { workspace = true }
log = { workspace = true }
maplit = { workspace = true }
parking_lot = { workspace = true }
petgraph = { workspace = true }
platform-dirs = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
profiling = { workspace = true, features = ["profile-with-tracing"] }
ron = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
rusqlite_migration = { workspace = true, features = ["from-directory"] }
serde_json = { workspace = true }
smallvec = { workspace = true }
static_assertions = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-tracy = { workspace = true, optional = true }
variadics_please = { workspace = true }

vfs = { workspace = true }


[features]
profiling = ["bevy/trace_tracy", "dep:tracing-tracy"]
watch = ["bevy/file_watcher"]

[dev-dependencies]
egui_demo_lib = { workspace = true }
bevy = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
